apiVersion: apps/v1
kind: Deployment
metadata:
  name: lost-and-found
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lost-and-found
  template:
    metadata:
      labels:
        app: lost-and-found
    spec:
      containers:
        - name: lost-and-found
          # <registry-host> is machine-specific - see README "Kubernetes" for
          # how to work out the right value (usually host.docker.internal, but
          # may need resolving to an IP if your cluster's image-pull proxy
          # can't reach that hostname directly).
          image: <registry-host>:5000/lost-and-found:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: lost-and-found-config }
            - secretRef: { name: lost-and-found-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lost-and-found
spec:
  type: NodePort
  selector:
    app: lost-and-found
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081

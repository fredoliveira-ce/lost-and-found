server.port=8081
spring.application.name=lost-and-found

# H2 in-memory database. DB_CLOSE_DELAY=-1 keeps the schema alive for the
# lifetime of the JVM instead of being dropped when the last connection closes.
spring.datasource.url=jdbc:h2:mem:lostandfound;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.nl.fred.lostandfound=INFO

# Actuator lives on its own port, off the JWT-secured API - see README "Monitoring".
# health itself has no auth to check against (the whole port is permitAll), so
# when-authorized means nobody unauthenticated sees more than UP/DOWN - no DB
# URLs or filesystem paths leaking to whatever can reach this port.
management.server.port=8082
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# without this, http.server.requests only exposes count/sum/max - no percentiles,
# which is what actually matters when reading load test results.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

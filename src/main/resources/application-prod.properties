spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lostandfound}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:lostandfound}
spring.datasource.password=${DB_PASSWORD:lostandfound}

# update, not create-drop: state must survive a restart and be shared across instances.
# A real deployment would use Flyway/Liquibase migrations instead - see README
# "Known simplifications".
spring.jpa.hibernate.ddl-auto=update
